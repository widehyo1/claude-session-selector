[package]
name = "claude-session-selector"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
arboard = "3.4"
crossterm = "0.29"
ratatui = "0.30"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "record-claude-session-info"
path = "src/bin/record-claude-session-info.rs"

[[bin]]
name = "select-claude-session"
path = "src/bin/select-claude-session.rs"

[[bin]]
name = "claude-replay-tui"
path = "src/bin/claude-replay-tui.rs"
